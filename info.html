      <div id="leftPanel">

          <select id="treename"></select>

          <a class="button" onclick="filterByStatusName()"> Search </a>

        <div class="card">
          <h3>Search By Zipcode and Damage on Sidewalk</h3>
          <input type="text" id="zipcode" placeholder="Enter Zipcode">

          <hr></hr>
          <a class="button" onclick="filterByDamageZip()"> Search </a>
        </div>


      </div>

      <div class="card" id="rightPanel">
        <h1> Data Cards </h1>
